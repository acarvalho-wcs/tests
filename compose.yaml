services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: archa
      POSTGRES_USER: archa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archa -d archa"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    environment:
      PGHOST: db
      PGDATABASE: archa
      PGUSER: archa
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  db_data:
