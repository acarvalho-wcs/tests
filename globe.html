<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCHA | 3D Globe</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.css"><link rel="stylesheet" href="./style.css"></head><body class="explorer"><header><a class="brand" href="./">◈ ARCHA <small>RESEARCH PLATFORM</small></a><nav><button id="searchTab">Search</button><button id="assistantTab">Research</button><button id="newsTab">News</button><a href="./">Home</a></nav></header><main class="workspace"><div id="map"></div><aside id="filters" class="panel"><div class="panel-head"><span>▣ FILTERS</span><button id="collapse" title="Toggle filters">−</button></div><div id="filterBody"><div class="status"><i></i><span id="mode">INITIALIZING</span></div><label for="q">SITE SEARCH</label><input id="q" placeholder="Search sites…" autocomplete="off"><div class="divider"></div><label for="country">COUNTRY</label><select id="country"><option value="">All countries</option></select><label for="category">SITE TYPE</label><select id="category"><option value="">All types</option></select><label for="source">DATA SOURCE</label><select id="source"><option value="">All sources</option></select><label>PERIOD (BCE − / CE +)</label><div class="split"><input id="from" type="number" placeholder="From"><input id="to" type="number" placeholder="To"></div><button id="reset" class="wide">RESET FILTERS</button><div class="divider"></div><div class="readout"><b id="count">—</b> MATCHING SITES</div><div id="results" class="results" aria-live="polite"></div><button id="more" class="wide" hidden>LOAD MORE</button></div></aside><div class="tools panel"><button id="projection">◉ GLOBE</button><button id="basemap">◧ DARK</button><button id="spin">▷ ROTATE</button><button id="home">⌂ RESET VIEW</button><button id="full">⛶ FULLSCREEN</button></div><aside id="drawer" class="panel drawer" hidden><div class="panel-head"><span id="drawerTi
