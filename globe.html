<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCHA | 3D Globe</title><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"}}</script></head><body class="explorer"><header><a class="brand" href="./">◈ ARCHA <small>RESEARCH PLATFORM</small></a><nav><button id="searchTab">Search</button><button id="assistantTab">Research</button><button id="newsTab">News</button><a href="./">Home</a></nav></header><main class="workspace"><div id="map"></div><aside id="filters" class="panel"><div class="panel-head"><span>▣ FILTERS</span><button id="collapse" title="Toggle filters">−</button></div><div id="filterBody"><div class="status"><i></i><span id="mode">INITIALIZING</span></div><label for="q">SITE SEARCH</label><input id="q" placeholder="Search sites…" autocomplete="off"><div class="divider"></div><label for="country">COUNTRY</label><select id="country"><option value="">All countries</option></select><label for="category">SITE TYPE</label><select id="category"><option value="">All types</option></select><label for="source">DATA SOURCE</label><select id="source"><option value="">All sources</option></select><label>PERIOD (BCE − / CE +)</label><div class="split"><input id="from" type="number" placeholder="From"><input id="to" type="number" placeholder="To"></div><button id="reset" class="wide">RESET FILTERS</button><div class="divider"></div><div class="readout"><b id="count">—</b> MATCHING SITES</div><div id="results" class="results" aria-live="polite"></div><button id="more" class="wide" hidden>LOAD MORE</button></div></aside><div class="tools panel original-tools"><div id="zoomPercent" class="zoom-percent-display">0%</div><button id="zoomIn" aria-label="Zoom in">+</button><div class="zoom-slider-wrapper"><span>3D Globe</span><input id="zoomRange" type="range" min="0" max="100" value="0" aria-label="Zoom" class="zoom-range-vertical"></div><button id="zoomOut" aria-label="Zoom out">−</button><button id="spin" aria-label="Resume rotation">▶</button><button id="full" title="Enter Fullscreen">⛶</button></div><aside id="drawer" class="panel drawer" hidden><div class="panel-head"><span id="drawerTitle">RESEARCH</span><button id="closeDrawer">×</button></div><div id="drawerBody"></div></aside><div class="mapstatus panel" hidden><span id="coord">0.000°, 0.000°</span> <span id="zoom">ZOOM 0%</span></div><div id="error" class="error" role="alert" hidden></div><noscript><div class="error">JavaScript and WebGL are required for the interactive globe.</div></noscript><a class="globe-credit" href="https://github.com/ancientnerds/AncientMap" target="_blank" rel="noopener">Globe source: Ancient Nerds · AGPL-3.0 · Natural Earth / upstream geographic data</a></main><script type="module">import('./app.js').catch(error=>{const n=document.getElementById('error');console.error('Globe startup failed',error);n.textContent='Globe could not start. ';n.title=String(error.message||error).slice(0,250);const b=document.createElement('button');b.textContent='RELOAD';b.onclick=()=>location.reload();n.append(b);n.hidden=false;document.getElementById('mode').textContent='STARTUP ERROR';document.getElementById('mode').dataset.state='error';});</script></body></html>
